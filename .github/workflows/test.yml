name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        # Each file is a standalone script that exits non-zero on failure.
        # None of them need a printer.
        run: |
          failed=0
          for test in tests/test_*.py; do
            echo "::group::$test"
            if python "$test"; then
              echo "ok"
            else
              echo "::error file=$test::$test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
