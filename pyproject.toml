[project]
name = "klipper-tui"
version = "0.1.0"
description = "A terminal UI for Klipper 3D printers, styled after Mainsail"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.scripts]
klipper-tui = "klipper_tui.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["klipper_tui*"]

[tool.setuptools.package-data]
klipper_tui = ["*.tcss"]
